name: Build execution environment

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: podman-host
    env:
      REGISTRY: git.jershlabs.xyz
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.1

      - name: Install build dependencies
        run: uv sync --locked

      - name: Log in to Forgejo container registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build and push image
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            image_tag="${GITHUB_REF#refs/tags/}"
          else
            image_tag=latest
          fi

          uv run --no-sync ansible-builder build \
            --tag "$image:$image_tag" \
            --tag "$image:$GITHUB_SHA" \
            --build-arg PYCMD=/usr/bin/python3.12

          docker push "$image:$image_tag"
          docker push "$image:$GITHUB_SHA"