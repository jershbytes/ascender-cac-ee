name: Build execution environment

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@latest

      - name: Install build dependencies
        run: uv sync --locked

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            image_tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            image_tag=latest
          else
            image_tag="build-$GITHUB_SHA"
          fi

          uv run --no-sync ansible-builder build \
            --container-runtime docker \
            --tag "$image:$image_tag" \
            --tag "$image:$GITHUB_SHA" \
            --build-arg PYCMD=/usr/bin/python3.12

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && ( "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ) ]]; then
            docker push "$image:$image_tag"
            docker push "$image:$GITHUB_SHA"
          fi